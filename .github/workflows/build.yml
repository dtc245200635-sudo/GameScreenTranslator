name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application and Extension
        run: |
          xcodebuild build \
            -project GameScreenTranslator.xcodeproj \
            -scheme GameTranslatorApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/GameTranslator.app Payload/
          zip -r -q GameTranslator.ipa Payload
          echo "Đóng gói GameTranslator.ipa thành công!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-IPA
          path: GameTranslator.ipa
          retention-days: 7
